  # ---- Google Jobs (via SerpApi) ----
  # Keep this last: company sites run first, so their direct links win
  # when the same job also shows up on Google.
  # Covers sites the other sources can't reach: AbbVie, Genentech, Lilly,
  # Analysis Group, research institutes, and any other employer Google indexes.
  # Each query uses 1 of the free plan's monthly searches.
  # Monthly use = number of queries x run days per month.
  # US: 7 x ~13 days = ~91; Taiwan: 3 x ~9 days = ~27; total ~118.
  # Check your quota on the SerpApi dashboard and trim if needed.
  - company: Google Jobs (US)
    type: google_jobs
    location: United States
    gl: us
    hl: en
    run_on: [Mon, Wed, Fri]
    queries:
      - "HEOR intern"
      - "health economics outcomes research internship"
      - "outcomes research intern pharmaceutical"
      - "market access intern pharmaceutical"
      - "HEOR part time"
      - "health economics research part time remote"
      - "health policy research intern institute"

  - company: Google Jobs (Taiwan)
    type: google_jobs
    location: Taiwan
    gl: tw
    hl: zh-TW
    run_on: [Tue, Fri]
    queries:
      - "HEOR intern"
      - "market access 實習"
      - "藥物經濟 實習 OR 兼職"
